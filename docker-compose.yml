services:
  web:
    build:
      context: ./web
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    ports:
      - "${WEB_PORT:-8080}:80"

  admin:
    build:
      context: ./admin
      args:
        VITE_ADMIN_API_URL: ${VITE_ADMIN_API_URL:-}
    ports:
      - "${ADMIN_PORT:-8081}:80"
