# NAS 生产 compose 片段：Vite 变量必须在 build.args，不能写在 environment
# 合并到 /home/Bely/docker-compose/docker-compose.yml 的 web-web / web-admin 段

  web-web:
    build:
      context: /home/Bely/code/Primordial_WEB/web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: "/api"

  web-admin:
    build:
      context: /home/Bely/code/Primordial_WEB/admin
      dockerfile: Dockerfile
      args:
        VITE_ADMIN_API_URL: "/admin-api"
